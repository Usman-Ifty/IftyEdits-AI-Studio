[project]
name = "iftyedits"
version = "0.1.0"
description = "IftyEdits AI Studio: local-first AI Shorts production for Apple Silicon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "faster-whisper>=1.2.1",
    "pydantic-settings>=2.16.3",
    "streamlit>=1.67.0",
]

[project.scripts]
iftyedits = "iftyedits.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "watchdog>=7.1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iftyedits"]

[tool.uv]
package = true

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PTH",      # use pathlib
    "S",        # bandit security
    "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # asserts and git subprocess calls in tests
"scripts/**" = ["S603", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["iftyedits", "tests"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "app"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
# faster-whisper and CTranslate2 type information is not relied on (adapter and scripts only).
module = ["faster_whisper", "faster_whisper.*", "ctranslate2", "ctranslate2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "ffmpeg: needs the ffmpeg/ffprobe binaries",
    "slow: slow test, skipped with -m 'not slow'",
    "model: runs a real speech model; opt-in with IFTYEDITS_RUN_MODEL_TESTS=1",
]
