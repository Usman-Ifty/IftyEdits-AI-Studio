name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # macOS 14 runners were retired from GitHub Actions on 2026-11-02.
    # macos-26 is Apple Silicon (arm64) and matches the local dev OS (macOS Tahoe 26).
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (no FFmpeg, no slow)
        run: uv run pytest -m "not ffmpeg and not slow"

  integration:
    # FFmpeg from apt; Linux runners start faster than macOS and need no Homebrew.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IFTYEDITS_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Integration tests (FFmpeg, Streamlit server)
        run: uv run pytest -m "ffmpeg or slow" -ra
