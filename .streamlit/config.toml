# Applies whenever Streamlit is started from the project root.
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[theme]
base = "dark"
primaryColor = "#7C6CFF"
backgroundColor = "#0B0F1A"
secondaryBackgroundColor = "#131A2B"
textColor = "#E8ECF5"
linkColor = "#5CC8FF"
borderColor = "#243049"
font = "sans serif"
baseRadius = "0.6rem"
